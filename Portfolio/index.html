<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:url" content="https://jmchavda2006-glitch.github.io/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Modular Stylesheets (Divided by Section for Easy Editing) -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/professional-journey.css">

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

<body>

    <!-- Top Scroll Progress Glow Bar -->
    <div class="scroll-progress-container" aria-hidden="true">
        <div id="scroll-progress-bar" class="scroll-progress-bar"></div>
    </div>

    <!-- Smooth Custom 3D Glass Cursor -->
    <div class="custom-cursor-dot"></div>
    <div class="custom-cursor-arrow"></div>

    <!-- Ambient Glass Background Lighting Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Responsive Glassmorphic Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#hero" class="logo">Jigar Chavda | <span class="gradient-text">Portfolio</span></a>

            <ul class="nav-links" id="nav-links">
                <li><a href="#hero" class="active">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#timeline">Journey</a></li>
                <li><a href="#credentials">Certifications</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#resume">Resume</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <div class="theme-toggle-wrapper">
                    <button type="button" id="theme-toggle-btn" class="theme-btn" title="Toggle Visual Interface Theme (Shortcut: T)" aria-label="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
                <button type="button" id="nav-toggle-btn" class="nav-toggle-btn" title="Toggle Navigation Menu" aria-label="Toggle Navigation Menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Modular Section Mount Points (Populated by sections/*.js) -->
    <main>
        <div id="home-mount"></div>
        <div id="about-mount"></div>
        <div id="professional-journey-mount"></div>
        <div id="certificates-mount"></div>
        <div id="projects-mount"></div>
        <div id="resume-mount"></div>
        <div id="get-in-touch-mount"></div>
    </main>

    <!-- Consolidated Brand Footer with Keyboard Shortcut Hints -->
    <footer class="site-footer">
        <div class="magnetic-wrap" style="margin: 0 auto 1rem auto;">
            <a href="#hero" class="footer-logo-btn magnetic-btn" title="Back to top">
                <img src="J.png" alt="Jigar Chavda Logo" class="footer-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                <span class="logo-fallback-badge" style="display: none;">J</span>
            </a>
        </div>
        <div class="footer-shortcuts">
            <span>Quick Shortcuts: Press <kbd class="kbd-badge">R</kbd> for Interactive Resume</span>
            <span>&bull;</span>
            <span>Press <kbd class="kbd-badge">T</kbd> to Toggle Theme</span>
        </div>
        <p class="footer-copyright">
            &copy; 2026 Jigar Chavda. All Rights Reserved.
        </p>
    </footer>

    <!-- Toast Notification Card -->
    <div id="toast-notification" class="toast-card" role="status" aria-live="polite">
        <i id="toast-icon" class="fas fa-check-circle"></i>
        <span id="toast-message"></span>
    </div>

    <!-- Floating Back-to-Top Button -->
    <button type="button" id="scroll-top-btn" class="scroll-top-fab" title="Scroll back to top" aria-label="Scroll back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Modular Section Files (Edit any section independently!) -->
    <script src="sections/home.js"></script>
    <script src="sections/about.js"></script>
    <script src="sections/professional-journey.js"></script>
    <script src="sections/certificates.js"></script>
    <script src="sections/projects.js"></script>
    <script src="sections/resume.js"></script>
